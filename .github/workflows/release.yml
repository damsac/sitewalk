# TestFlight release pipeline — REBUILD ERA (Rust core + apps/ios shell).
#
# This file was rewritten in place on 2026-07-05 for the rebuilt app. The Era-I
# version (Swift-era app, project.yml/Makefile) is preserved in git history —
# `git log --follow .github/workflows/release.yml`. It is REWRITTEN IN PLACE (not
# a new file) on purpose: `github.run_number` is per-workflow-file, so reusing
# this file keeps the build-number counter monotonic vs the Era-I builds already
# on App Store Connect. A fresh workflow file would restart run_number at 1 and
# collide with existing (MARKETING_VERSION, build) pairs in TestFlight.
#
# SIGNING: MANUAL at BOTH archive and export (changed 2026-07-14).
#   The Era-I blueprint archived with AUTOMATIC signing (-allowProvisioningUpdates
#   + ASC API key -> cloud signing). That minted a fresh 'Created via API'
#   Development cert on team 98GXNZ6NKZ EVERY run; with three apps' CI on the
#   shared team, the team hit Apple's dev-cert cap on 2026-07-14 (athanor-app's
#   archive died with 'choose a certificate to revoke'). The archive now signs
#   MANUALLY with the same imported Distribution cert + downloaded 'Murmur App
#   Store' profile the export step always used — both are already on the runner
#   before archive. No cloud signing anywhere; CI mints zero certs.
#   - export was ALWAYS manual (ExportOptions signingStyle=manual, explicit
#     provisioningProfiles dict, NO -allowProvisioningUpdates — cloud signing
#     fails there under an App Manager key)
#   - bundle id com.isaacwm.murmur + "Murmur App Store" profile (reused)
#   - build number = github.run_number; tag v* overrides MARKETING_VERSION
#   - the brew install||true / brew link --overwrite pattern; XcodeGen #691 guard
#
# WHAT CHANGED for the rebuild:
#   - builds the REAL Rust core: apps/ios/build-ffi.sh --features whisper
#     --device-only produces the MurmurCoreFFI xcframework on the runner (no nix;
#     rustup cargo + system Xcode toolchain). Device-only halves the whisper.cpp
#     compile — a TestFlight archive is device-only anyway.
#   - provisions the on-device whisper model via apps/ios/fetch-whisper-model.sh
#     (sha256-pinned, base.en default) cached with actions/cache.
#   - project-release.yml (xcodegen) replaces the removed project.yml/Makefile.
#   - export uses destination=export (produces a signed .ipa artifact); the ASC
#     upload is a SEPARATE, conditional altool step so a dry-run can verify the
#     whole chain through signing without publishing.
#   - NO App Group, NO entitlements, NO analytics injection: apps/ios uses none
#     (it reads only PPQ_API_KEY from Info.plist) — simpler than Era-I.
#
# Two release lanes:
#   - Push to main         -> internal TestFlight (continuous; team dogfoods)
#   - Push tag (v1.2.3)     -> external candidate (MARKETING_VERSION from the tag)
#   - workflow_dispatch     -> dry-run by default (upload=false): builds, signs,
#                              exports the .ipa artifact, SKIPS the ASC upload.
#                              Set upload=true to publish a manual build.
#
# Setup steps (one-time, outside CI) are documented in meta/TESTFLIGHT_CI_SETUP.md.
#
# Required GitHub secrets:
#   APPLE_TEAM_ID          Apple Developer Team ID (98GXNZ6NKZ)
#   ASC_API_KEY_ID         App Store Connect API key ID (App Manager role)
#   ASC_API_ISSUER_ID      App Store Connect issuer UUID
#   ASC_API_KEY_P8         Full contents of AuthKey_*.p8 (text, not base64)
#   APPLE_CERT_P12         base64 Apple Distribution cert + private key (.p12)
#   APPLE_CERT_PASSWORD    password for the .p12
#   PPQ_API_KEY            LLM API key (expanded into Info.plist at build time)

name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
    # paths-ignore only filters BRANCH pushes (per GitHub Actions docs: "Path
    # filters are not evaluated for pushes of tags") — a v* tag push always
    # fires this workflow regardless of what files it touches, and
    # workflow_dispatch is a separate trigger entirely, also unaffected.
    # Code merges to main publish (internal TestFlight); docs/meta-only
    # merges to main do not — nothing in those changes affects the shipped
    # app, so there's no reason to burn a build number or a TestFlight slot.
    paths-ignore:
      - 'docs/**'
      - 'meta/**'
      - '**.md'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      upload:
        description: 'Upload the signed build to TestFlight (false = dry-run: build + sign + export .ipa only)'
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Model choice + sha256 digests live in apps/ios/fetch-whisper-model.sh (the
  # same script ./generate.sh uses locally) — this is the default it fetches.
  # small.en (2026-07-23): field accuracy > raw speed. base.en shipped on the
  # first external build and a tester reported worse transcription + inaccurate
  # notes — small.en is spike-validated better on every WER/hallucination axis.
  # It was demoted 2026-07-10 for felt lag on iPhone 16e, but that was BEFORE
  # the Plan 20 whisper warm-up (#245); re-verify live RTF on device before a
  # wide roll-out. One-line revert if it lags: base.en + ggml-base.en-q5_1.bin.
  WHISPER_MODEL: small.en
  MODEL_FILENAME: ggml-small.en-q5_1.bin

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'

      - name: Cache Homebrew packages
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            /opt/homebrew/Cellar/xcodegen
            /opt/homebrew/Cellar/xcbeautify
          key: brew-${{ runner.os }}-xcodegen-xcbeautify-cmake

      - name: Install tools
        run: |
          brew install xcodegen xcbeautify cmake || true
          brew link --overwrite xcodegen xcbeautify || true

      - name: Set up Rust (iOS device target)
        run: |
          rustup show active-toolchain || rustup default stable
          # Device slice is what ships (the archive is device-only). build-ffi.sh
          # runs --device-only in CI, so only the device target is required.
          rustup target add aarch64-apple-ios

      - name: Determine version, lane, and upload flag
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Tag '$TAG' does not match v<major>.<minor>.<patch>"
              exit 1
            fi
            MARKETING_VERSION="${TAG#v}"
            LANE=external
            UPLOAD=true
            echo "Release lane: external (tag $TAG -> MARKETING_VERSION=$MARKETING_VERSION)"
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            MARKETING_VERSION=""
            LANE=manual
            UPLOAD="${{ github.event.inputs.upload }}"
            echo "Release lane: manual (upload=$UPLOAD)"
          else
            MARKETING_VERSION=""
            LANE=internal
            UPLOAD=true
            echo "Release lane: internal (MARKETING_VERSION from project-release.yml)"
          fi
          {
            echo "marketing_version=$MARKETING_VERSION"
            echo "lane=$LANE"
            echo "upload=$UPLOAD"
          } >> "$GITHUB_OUTPUT"
          echo "Build number: ${{ github.run_number }}"

      - name: Cache whisper model
        id: model-cache
        uses: actions/cache@v4
        with:
          path: apps/ios/Sources/Resources/${{ env.MODEL_FILENAME }}
          # Keyed on the fetch script itself (not a duplicated sha literal here)
          # so a digest/model bump in the script busts the cache automatically.
          key: whisper-model-${{ env.WHISPER_MODEL }}-${{ hashFiles('apps/ios/fetch-whisper-model.sh') }}

      - name: Download and verify whisper model
        run: |
          cd apps/ios
          ./fetch-whisper-model.sh "$WHISPER_MODEL"

      - name: Materialize ASC API key
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
        run: |
          if [ -z "$ASC_API_KEY_P8" ]; then
            echo "::error::ASC_API_KEY_P8 secret not set"
            exit 1
          fi
          # (The archive no longer takes -authenticationKey* — manual signing,
          # 2026-07-14 cert-cap fix. The key below serves altool only.)
          # For `xcrun altool --upload-app`, which auto-discovers the key by ID
          # from ~/.appstoreconnect/private_keys/AuthKey_<KEYID>.p8.
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$ASC_API_KEY_P8" > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_API_KEY_ID}.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_API_KEY_ID}.p8"

      - name: Import Apple Distribution certificate
        uses: Apple-Actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERT_P12 }}
          p12-password: ${{ secrets.APPLE_CERT_PASSWORD }}

      - name: Download App Store provisioning profile
        uses: Apple-Actions/download-provisioning-profiles@v3
        with:
          bundle-id: com.isaacwm.murmur
          profile-type: IOS_APP_STORE
          issuer-id: ${{ secrets.ASC_API_ISSUER_ID }}
          api-key-id: ${{ secrets.ASC_API_KEY_ID }}
          api-private-key: ${{ secrets.ASC_API_KEY_P8 }}

      - name: Build MurmurCoreFFI xcframework (real core)
        run: |
          cd apps/ios
          ./build-ffi.sh --features whisper --device-only

      - name: Generate Xcode project (release spec)
        run: |
          cd apps/ios
          xcodegen generate --spec project-release.yml

      - name: Debug build settings
        run: |
          xcodebuild -project apps/ios/SitewalkGallery.xcodeproj -scheme SitewalkGallery \
            -showBuildSettings -configuration Release 2>/dev/null \
            | grep -E "^\s+(CODE_SIGN|DEVELOPMENT_TEAM|PROVISIONING|PRODUCT_BUNDLE_ID|MARKETING_VERSION|CURRENT_PROJECT_VERSION)" \
            | sort -u

      - name: Write ExportOptions.plist
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>export</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.isaacwm.murmur</key>
              <string>Murmur App Store</string>
            </dict>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF

      - name: Archive
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PPQ_API_KEY: ${{ secrets.PPQ_API_KEY }}
          JEFE_PROXY_URL: ${{ vars.JEFE_PROXY_URL }}
          JEFE_APP_SECRET: ${{ secrets.JEFE_APP_SECRET }}
          MARKETING_VERSION_OVERRIDE: ${{ steps.version.outputs.marketing_version }}
        run: |
          if [ -z "$APPLE_TEAM_ID" ]; then
            echo "::error::APPLE_TEAM_ID secret not set"
            exit 1
          fi
          BUILD_SETTINGS=(
            # Manual signing (2026-07-14, shared-team cert-cap fix): the
            # Distribution cert is already in the keychain (import-codesign-certs)
            # and the profile already downloaded (download-provisioning-profiles)
            # — the export step has always signed from exactly these. Automatic
            # + -allowProvisioningUpdates cloud-minted a throwaway dev cert per
            # run and capped team 98GXNZ6NKZ with three apps' CI running.
            "CODE_SIGN_STYLE=Manual"
            "CODE_SIGN_IDENTITY=Apple Distribution"
            "PROVISIONING_PROFILE_SPECIFIER=Murmur App Store"
            "DEVELOPMENT_TEAM=$APPLE_TEAM_ID"
            "CURRENT_PROJECT_VERSION=${{ github.run_number }}"
            "PPQ_API_KEY=$PPQ_API_KEY"
            # The proxy (services/proxy). When BOTH are non-empty the app
            # routes through it and NO Anthropic key is present in the build —
            # which is the point: a key in Info.plist is extractable from any
            # downloaded IPA (EngineResolution.swift resolveCredential()).
            #
            # SAFE WHEN UNSET: absent secrets expand to empty strings, the app
            # falls through to the direct-key path, and the build behaves
            # exactly as it does today. So this can land before the secrets
            # exist without changing a single shipped build.
            #
            # JEFE_PROXY_URL is a plain var (a URL is not a secret); the app
            # secret is a repo secret. Both must be set together — a URL
            # without the secret is rejected by the proxy on every call.
            "JEFE_PROXY_URL=$JEFE_PROXY_URL"
            "JEFE_APP_SECRET=$JEFE_APP_SECRET"
            # NO ANTHROPIC_BASE_URL override: the key in the PPQ_API_KEY secret
            # is a direct Anthropic key (sk-ant-…), verified live against
            # api.anthropic.com and REJECTED (401) by api.ppq.ai. Builds #24–#32
            # shipped with the ppq.ai override and every walk degraded to
            # "saved offline" — the key/host pair must match; empty here means
            # the provider default (api.anthropic.com), which this key wants.
            # If the account ever moves to a PPQ-issued key, restore the
            # override AND rotate the secret together.
          )
          if [ -n "$MARKETING_VERSION_OVERRIDE" ]; then
            BUILD_SETTINGS+=("MARKETING_VERSION=$MARKETING_VERSION_OVERRIDE")
          fi
          set -o pipefail && xcodebuild archive \
            -project apps/ios/SitewalkGallery.xcodeproj \
            -scheme SitewalkGallery \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Murmur.xcarchive" \
            "${BUILD_SETTINGS[@]}" \
            | xcbeautify

      - name: Export signed .ipa
        run: |
          set -o pipefail && xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Murmur.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            | xcbeautify

      - name: Upload .ipa artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: Murmur-${{ steps.version.outputs.lane }}-${{ github.run_number }}-ipa
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 30
          if-no-files-found: warn

      - name: Upload to TestFlight
        if: ${{ steps.version.outputs.upload == 'true' }}
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          set -o pipefail
          IPA=$(find "$RUNNER_TEMP/export" -maxdepth 1 -name '*.ipa' | head -1)
          if [ -z "$IPA" ]; then
            echo "::error::No .ipa found in $RUNNER_TEMP/export — nothing to upload"
            exit 1
          fi
          echo "Uploading $IPA to TestFlight"
          LOG="$RUNNER_TEMP/altool-upload.log"
          # altool's real exit code is the primary signal, but it has
          # historically exited 0 on some validation failures (the cause of
          # builds #18-22 silently landing rejected: "Missing required icon
          # file... 120x120" reported success here). Belt-and-suspenders:
          # tee the output and grep it for altool's own failure markers, and
          # fail the step if either check trips.
          xcrun altool --upload-app --type ios --file "$IPA" \
            --apiKey "$ASC_API_KEY_ID" --apiIssuer "$ASC_API_ISSUER_ID" \
            2>&1 | tee "$LOG"
          STATUS=${PIPESTATUS[0]}
          if [ "$STATUS" -ne 0 ]; then
            echo "::error::altool exited $STATUS — upload failed"
            exit "$STATUS"
          fi
          # Match FAILURE signatures only. A bare 'error' pattern matched the
          # word inside altool's SUCCESS line ("UPLOAD SUCCEEDED with no
          # errors") and failed build #24's run AFTER Apple accepted it —
          # require the explicit failure markers, and independently require
          # the success line to be present.
          if grep -qiE 'UPLOAD FAILED|ERROR: \[|\*\*\* Error' "$LOG"; then
            echo "::error::altool exited 0 but its output reports a failure — treating as a failed upload"
            exit 1
          fi
          if ! grep -qi 'UPLOAD SUCCEEDED' "$LOG"; then
            echo "::error::altool exited 0 but never printed UPLOAD SUCCEEDED — treating as a failed upload"
            exit 1
          fi

      - name: Dry-run notice
        if: ${{ steps.version.outputs.upload != 'true' }}
        run: |
          echo "::notice::Dry-run (upload=false): built, signed, and exported the .ipa artifact but did NOT upload to TestFlight. Re-run with upload=true, or push to main / a v* tag, to publish."

      - name: Clean up API keys
        if: ${{ always() }}
        run: |
          rm -f "$RUNNER_TEMP/private_keys/AuthKey.p8"
          rm -f "$HOME"/.appstoreconnect/private_keys/AuthKey_*.p8
