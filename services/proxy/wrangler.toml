name = "jefe-proxy"
main = "src/index.ts"
compatibility_date = "2026-07-25"

# Secrets are NOT set here — `wrangler.toml` is committed. Set them with:
#   wrangler secret put ANTHROPIC_API_KEY
#   wrangler secret put APP_SECRET
# See README.md.

[vars]
# Blast-radius limiters, tunable without a code deploy. Both are checked
# BEFORE a request is forwarded upstream.
DAILY_SPEND_CAP_USD = "25"
PER_INSTALL_DAILY_CAP_USD = "2"

[[kv_namespaces]]
binding = "METER"
# Created 2026-07-26 via `wrangler kv namespace create METER`.
# Not a secret — a namespace id is useless without account credentials.
id = "b23e593ab16e469b8a60167557cb3fac"

[observability]
enabled = true
