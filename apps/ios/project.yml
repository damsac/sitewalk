name: SitewalkGallery
# DEMO base spec — self-sufficient with zero setup: a clean checkout builds the
# scripted DemoWalkEngine app from this file alone (no MurmurCoreFFI package, so
# `#if canImport(MurmurCoreFFI)` is false and the real-core code compiles out).
#
#   xcodegen generate                 -> demo app (this spec)
#   ./build-ffi.sh && ./generate.sh   -> upgrades to the REAL murmur-core engine
#
# The real-core build is opted into by ./generate.sh, which generates from
# project-real.yml (this spec + the gitignored project.local.yml, which adds the
# MurmurCoreFFI package dependency and the injected ANTHROPIC_BASE_URL build
# setting).
options:
  bundleIdPrefix: com.damsac
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
targets:
  SitewalkGallery:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: Sources/App/Info.plist
      properties:
        # Provider base URL (e.g. https://api.ppq.ai). Literal build-variable
        # reference — the real value is a build setting supplied by the
        # gitignored project.local.yml and expanded by xcodebuild into the
        # built app's Info.plist. Empty => provider default
        # (api.anthropic.com). This tracked value never holds a secret.
        ANTHROPIC_BASE_URL: "$(ANTHROPIC_BASE_URL)"
        # The proxy (services/proxy) — the ONLY path a shipped build has to
        # Anthropic. There is deliberately no Anthropic-key field here: a key
        # in Info.plist is extractable from any downloaded IPA. Local real-core
        # development uses the ANTHROPIC_API_KEY *environment variable*
        # instead (see EngineResolution.swift resolveCredential()). Same
        # build-variable injection; neither tracked value ever holds a secret.
        JEFE_PROXY_URL: "$(JEFE_PROXY_URL)"
        JEFE_APP_SECRET: "$(JEFE_APP_SECRET)"
        CFBundleDisplayName: Jefe
        CFBundleName: Jefe
        # Fixed paper-and-ink theme: lock light appearance so system dark mode
        # never falls un-styled Text back to the white system label color on the
        # always-light paper (issue #220 — invisible board title / vocab / rows).
        UIUserInterfaceStyle: Light
        # App uses only exempt (HTTPS/TLS) encryption — no custom crypto. Without
        # this, every TestFlight build sits on a manual "Missing Compliance"
        # answer in ASC before testers can install it.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: "Jefe records your walk-and-talk so it can turn it into paperwork."
        # Keep recording when the screen locks / the phone is pocketed. Without
        # this, iOS suspends the app on lock and the mic goes silent mid-walk —
        # which breaks the core "press record, pocket the phone, keep walking"
        # flow. Paired with the `.record` AVAudioSession in AudioCaptureSource.
        UIBackgroundModes:
          - audio
        NSCameraUsageDescription: "Photos you take during a walk pin to the item you're describing and land in the finished document."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIAppFonts:
          - Barlow-Regular.ttf
          - Barlow-Medium.ttf
          - Barlow-SemiBold.ttf
          - Barlow-Bold.ttf
          - Barlow-ExtraBold.ttf
          - BarlowSemiCondensed-Medium.ttf
          - BarlowSemiCondensed-SemiBold.ttf
          - IBMPlexMono-Regular.ttf
          - IBMPlexMono-Medium.ttf
          - IBMPlexMono-SemiBold.ttf
          - SourceSerif4-SemiBold.ttf
          - SourceSerif4-Bold.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.damsac.sitewalk.gallery
        CODE_SIGNING_ALLOWED: "NO"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    # Explicit scheme so `xcodebuild test -scheme SitewalkGallery` runs the
    # unit tests (Plan 15: VocabPackTests, the bundled-pack schema gate).
    # Build behavior for CI's plain `build` action is unchanged.
    scheme:
      testTargets:
        - SitewalkGalleryTests
      # Local StoreKit testing (Jefe.storekit): lets the paywall load a real
      # Product, show a real localized price, and complete a real purchase flow
      # in the simulator without App Store Connect.
      #
      # This lives in the scheme's LAUNCH action only. `xcodebuild archive`
      # doesn't read the launch action, so TestFlight and App Store builds
      # transact against the real App Store — a local config can't leak into a
      # shipped build. The file is deliberately OUTSIDE Sources/ so it is never
      # copied into the app bundle.
      storeKitConfiguration: Jefe.storekit
  # Plan 15: hosted unit tests for app-side contracts that need no simulator
  # UI — today just VocabPackTests (every bundled vocab pack decodes and obeys
  # the seeding schema: version >= 1, <= 60 terms, no ci-dupes, 1-6 words).
  SitewalkGalleryTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: SitewalkGallery
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.damsac.sitewalk.gallery.tests
        CODE_SIGNING_ALLOWED: "NO"
        TARGETED_DEVICE_FAMILY: "1"
